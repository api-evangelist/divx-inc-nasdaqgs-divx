name: DivX, Inc. (NasdaqGS:DIVX)
description: >-
  DivX is a San Diego-based digital video technology company best known for the
  DivX video codec and format. Under the former public company DivX, Inc.
  (NasdaqGS:DIVX), and today as DivX, LLC, it offers free and premium consumer
  software — DivX Software and DivX Pro for Windows and macOS — for playing,
  converting, and casting video, alongside a technology-licensing business that
  certifies DivX and HEVC playback in consumer electronics devices (the "DivX
  Certified" program). The company distributes desktop applications to end users
  and licenses codecs and playback technology to device manufacturers rather
  than operating a public developer API platform. Customer support is handled
  through a Zendesk help center, and enterprise/device partners are served via a
  Salesforce-based partner portal.
